<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Task App">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6a11cb">
    <title>Task Manager App</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✅</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            overscroll-behavior: none;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            /* Prevent text selection */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }
        
        .status-bar {
            height: 25px;
            background: #000;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 12px;
        }
        
        .status-bar .time {
            font-weight: 600;
        }
        
        .status-bar .icons {
            display: flex;
            gap: 5px;
        }
        
        .header {
            height: 60px;
            background: #6a11cb;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        
        .header-icons {
            display: flex;
            gap: 15px;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }
        
        .add-task-container {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
        }
        
        .task-input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #f0f0f0;
            font-size: 16px;
        }
        
        .add-button {
            padding: 15px;
            background: #6a11cb;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .task-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        .task-checkbox {
            margin-right: 15px;
            width: 22px;
            height: 22px;
            accent-color: #6a11cb;
        }
        
        .task-text {
            flex: 1;
            font-size: 16px;
        }
        
        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }
        
        .task-delete {
            color: #ff4757;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }
        
        .navigation {
            display: flex;
            height: 70px;
            background: white;
            border-top: 1px solid #eee;
        }
        
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            text-decoration: none;
        }
        
        .nav-item.active {
            color: #6a11cb;
        }
        
        .nav-icon {
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            text-align: center;
        }
        
        .stat-item {
            padding: 15px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #6a11cb;
        }
        
        .stat-label {
            font-size: 14px;
            color: #888;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #888;
        }
        
        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
            color: #ddd;
        }
        
        .install-prompt {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            display: none;
            z-index: 1000;
        }
        
        @media (max-height: 700px) {
            .app-container {
                height: 95vh;
            }
            
            .header {
                height: 50px;
            }
            
            .content {
                padding: 15px;
            }
        }
        
        /* Prevent zoom on input focus */
        @media screen and (max-width: 480px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="status-bar">
            <div class="time">12:30</div>
            <div class="icons">📶 🔋 100%</div>
        </div>
        
        <div class="header">
            <h1>Task Manager</h1>
            <div class="header-icons">
                <i class="fas fa-search"></i>
                <i class="fas fa-ellipsis-v"></i>
            </div>
        </div>
        
        <div class="content">
            <div class="add-task-container">
                <input type="text" class="task-input" placeholder="Add a new task...">
                <button class="add-button">Add</button>
            </div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="total-tasks">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="completed-tasks">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="remaining-tasks">0</div>
                    <div class="stat-label">Remaining</div>
                </div>
            </div>
            
            <div class="tasks-container" id="tasks-list">
                <div class="empty-state">
                    <i class="fas fa-tasks"></i>
                    <p>No tasks yet</p>
                    <p>Add a task to get started</p>
                </div>
            </div>
        </div>
        
        <div class="navigation">
            <a href="#" class="nav-item active">
                <div class="nav-icon"><i class="fas fa-home"></i></div>
                <div>Home</div>
            </a>
            <a href="#" class="nav-item">
                <div class="nav-icon"><i class="fas fa-calendar"></i></div>
                <div>Calendar</div>
            </a>
            <a href="#" class="nav-item">
                <div class="nav-icon"><i class="fas fa-check-circle"></i></div>
                <div>Tasks</div>
            </a>
            <a href="#" class="nav-item">
                <div class="nav-icon"><i class="fas fa-cog"></i></div>
                <div>Settings</div>
            </a>
        </div>
    </div>

    <div class="install-prompt" id="installPrompt">
        Install this app for a better experience
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elements
            const taskInput = document.querySelector('.task-input');
            const addButton = document.querySelector('.add-button');
            const tasksList = document.getElementById('tasks-list');
            const totalTasks = document.getElementById('total-tasks');
            const completedTasks = document.getElementById('completed-tasks');
            const remainingTasks = document.getElementById('remaining-tasks');
            const installPrompt = document.getElementById('install-prompt');
            
            // Tasks array
            let tasks = [];
            
            // Update time in status bar
            function updateTime() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                document.querySelector('.status-bar .time').textContent = timeStr;
            }
            
            setInterval(updateTime, 60000);
            updateTime();
            
            // Add task function
            function addTask() {
                const taskText = taskInput.value.trim();
                if (taskText === '') return;
                
                const task = {
                    id: Date.now(),
                    text: taskText,
                    completed: false
                };
                
                tasks.push(task);
                taskInput.value = '';
                renderTasks();
            }
            
            // Render tasks
            function renderTasks() {
                // Update stats
                totalTasks.textContent = tasks.length;
                const completedCount = tasks.filter(task => task.completed).length;
                completedTasks.textContent = completedCount;
                remainingTasks.textContent = tasks.length - completedCount;
                
                // Clear tasks list
                tasksList.innerHTML = '';
                
                if (tasks.length === 0) {
                    tasksList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-tasks"></i>
                            <p>No tasks yet</p>
                            <p>Add a task to get started</p>
                        </div>
                    `;
                    return;
                }
                
                // Add tasks to list
                tasks.forEach(task => {
                    const taskElement = document.createElement('div');
                    taskElement.className = `task-item ${task.completed ? 'completed' : ''}`;
                    taskElement.innerHTML = `
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''}>
                        <div class="task-text">${task.text}</div>
                        <button class="task-delete"><i class="fas fa-trash"></i></button>
                    `;
                    
                    tasksList.appendChild(taskElement);
                    
                    // Add event listeners
                    const checkbox = taskElement.querySelector('.task-checkbox');
                    const deleteBtn = taskElement.querySelector('.task-delete');
                    
                    checkbox.addEventListener('change', () => toggleTask(task.id));
                    deleteBtn.addEventListener('click', () => deleteTask(task.id));
                });
            }
            
            // Toggle task completion
            function toggleTask(id) {
                tasks = tasks.map(task => {
                    if (task.id === id) {
                        return {...task, completed: !task.completed};
                    }
                    return task;
                });
                renderTasks();
            }
            
            // Delete task
            function deleteTask(id) {
                tasks = tasks.filter(task => task.id !== id);
                renderTasks();
            }
            
            // Event listeners
            addButton.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
            
            // Navigation
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    navItems.forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');
                });
            });
            
            // Prevent context menu
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
            
            // Initial render
            renderTasks();
            
            // Check if app is running in standalone mode
            if (window.matchMedia('(display-mode: standalone)').matches) {
                console.log("Running as a standalone app");
            } else {
                // Show install prompt after a delay
                setTimeout(() => {
                    // installPrompt.style.display = 'block';
                    // setTimeout(() => { installPrompt.style.display = 'none'; }, 5000);
                }, 3000);
            }
            
            // Register service worker for PWA functionality
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/sw.js').then(function(registration) {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
                });
            }
        });
        
        // Prevent bounce effect on iOS
        document.body.addEventListener('touchmove', function(e) {
            if (e.target === this || e.target.classList.contains('content')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
